server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 한 오리진에서 화면과 API 를 같이 내보낸다.
    # 개발 때 Vite 프록시가 하던 일과 모양을 맞춘 것이라, 프론트 코드에 서버 주소가 없다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 감사 로그에 남는 접속 IP 가 전부 nginx 가 되면 안 된다
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP 핸드셰이크는 Upgrade 헤더를 그대로 넘겨야 붙는다.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # 조용한 시간대에 끊기지 않게 넉넉히 둔다
        proxy_read_timeout 3600s;
    }

    # 파일명에 해시가 붙어 있어 오래 캐시해도 안전하다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 주소창에 직접 친 /ward/board 같은 경로도 index.html 이 받아야 한다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
