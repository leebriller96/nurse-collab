spring:
  application:
    name: nurse-collab

  datasource:
    url: jdbc:postgresql://localhost:5432/nursecollab
    username: nursecollab
    password: nursecollab

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # 로컬 개발용 기본값이다. 운영에서는 반드시 JWT_SECRET 환경변수로 덮어쓴다.
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-production-0123456789}
  access-token-validity: 30m
  refresh-token-validity: 14d

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. 인증 없이 열리는 경로라 다른 것은 내보내지 않는다.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nursecollab: DEBUG
