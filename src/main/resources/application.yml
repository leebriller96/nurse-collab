spring:
  application:
    name: nurse-collab

  datasource:
    url: jdbc:postgresql://localhost:5432/nursecollab
    username: nursecollab
    password: nursecollab

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # RS256 키쌍. 대칭키가 아닌 이유는 JwtProperties 주석에 있다 —
  # 검증만 하면 되는 원내 게이트웨이에 발급까지 가능한 키를 줄 수 없다.
  #
  # 아래 기본값은 로컬 개발용이고 저장소에 공개돼 있다. 운영에서 그대로 쓰면
  # 누구나 관리자 토큰을 위조할 수 있다. prod 프로파일에서는 JwtKeyGuard 가
  # 공개키 지문을 보고 기동을 막는다.
  #
  # 개인키는 토큰을 발급하는 쪽에만 준다. 환경변수가 아니라 파일로 넘긴다.
  # 환경변수로 넘기면 docker inspect 와 프로세스 목록에 그대로 찍힌다.
  private-key: ${JWT_PRIVATE_KEY_FILE:classpath:keys/local-dev-only-private.pem}
  public-key: ${JWT_PUBLIC_KEY_FILE:classpath:keys/local-dev-only-public.pem}
  access-token-validity: 30m
  refresh-token-validity: 14d

app:
  work-api:
    # 원내가 업무 쪽에 묻는 곳(WorkRelationPort).
    # 비워 두면 같은 프로세스가 답한다 — 한 서버로 띄울 때다.
    # 원내 역할로 따로 띄울 때만 업무 서버 주소를 넣는다. 그때는 사용자 토큰을 실어 HTTP 로 묻는다.
    base-url: ${WORK_API_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 3s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. 인증 없이 열리는 경로라 다른 것은 내보내지 않는다.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nursecollab: DEBUG
