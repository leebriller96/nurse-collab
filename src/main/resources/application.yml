spring:
  application:
    name: nurse-collab

  datasource:
    url: jdbc:postgresql://localhost:5432/nursecollab
    username: nursecollab
    password: nursecollab

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # 한쪽 테이블만 건드리는 마이그레이션은 db/phi · db/work 에 둔다.
    # 합친 DB 는 셋 다 돈다. 역할 DB 는 자기 쪽 폴더만 돈다(application-cloud/onprem.yml).
    locations: classpath:db/migration,classpath:db/phi,classpath:db/work

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # RS256 키쌍. 대칭키가 아닌 이유는 JwtProperties 주석에 있다 —
  # 검증만 하면 되는 원내 게이트웨이에 발급까지 가능한 키를 줄 수 없다.
  #
  # 아래 기본값은 로컬 개발용이고 저장소에 공개돼 있다. 운영에서 그대로 쓰면
  # 누구나 관리자 토큰을 위조할 수 있다. prod 프로파일에서는 JwtKeyGuard 가
  # 공개키 지문을 보고 기동을 막는다.
  #
  # 개인키는 토큰을 발급하는 쪽에만 준다. 환경변수가 아니라 파일로 넘긴다.
  # 환경변수로 넘기면 docker inspect 와 프로세스 목록에 그대로 찍힌다.
  private-key: ${JWT_PRIVATE_KEY_FILE:classpath:keys/local-dev-only-private.pem}
  public-key: ${JWT_PUBLIC_KEY_FILE:classpath:keys/local-dev-only-public.pem}
  access-token-validity: 30m
  refresh-token-validity: 14d

app:
  # combined(한 서버가 둘 다) / cloud(업무 서버) / onprem(원내 서버).
  # 직접 바꾸지 않고 프로파일(cloud, onprem)로 켠다. 프로파일이 마이그레이션 위치까지 함께 바꾼다.
  role: combined
  work-api:
    # 원내가 업무 쪽에 묻는 곳(WorkRelationPort).
    # 비워 두면 같은 프로세스가 답한다 — 한 서버로 띄울 때다.
    # 원내 역할로 따로 띄울 때만 업무 서버 주소를 넣는다. 그때는 사용자 토큰을 실어 HTTP 로 묻는다.
    base-url: ${WORK_API_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 3s
  push:
    # 폰 알림(Web Push). 키 파일이 없으면 꺼진다 — 서버는 뜨고 화면에 버튼만 안 나온다.
    # 만드는 법은 docs/05-deployment.md 4-2. 키를 바꾸면 기존 구독이 전부 무효가 된다.
    vapid-private-key: ${VAPID_PRIVATE_KEY_FILE:}
    vapid-public-key: ${VAPID_PUBLIC_KEY_FILE:}
    subject: ${VAPID_SUBJECT:mailto:nurse-collab@example.com}
    # 보내도 되는 푸시 서비스. 크롬·엣지(FCM), 파이어폭스, 사파리(iOS 포함), 윈도우.
    allowed-hosts:
      - fcm.googleapis.com
      - updates.push.services.mozilla.com
      - web.push.apple.com
      - "*.push.apple.com"
      - "*.notify.windows.com"
  login-limit:
    # 같은 아이디로 이만큼 틀리면 창이 끝날 때까지 막는다. 맞는 비밀번호여도 안 열린다.
    max-failures: 10
    window: 15m
  delay-escalation:
    # 이 시간 동안 아무도 접수하지 않으면 양쪽 수간호사와 요청자에게 한 번 알린다. 일반 요청은 올리지 않는다.
    emergency-minutes: 10
    urgent-minutes: 30

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 헬스체크만 연다. 인증 없이 열리는 경로라 다른 것은 내보내지 않는다.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.nursecollab: DEBUG
