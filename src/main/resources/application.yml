spring:
  application:
    name: nurse-collab

  datasource:
    url: jdbc:postgresql://localhost:5432/nursecollab
    username: nursecollab
    password: nursecollab

  jpa:
    hibernate:
      # 스키마의 주인은 Flyway 다. Hibernate 는 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

logging:
  level:
    com.nursecollab: DEBUG
