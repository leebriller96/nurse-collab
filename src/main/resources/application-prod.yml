# 컨테이너로 띄울 때만 켜진다 (SPRING_PROFILES_ACTIVE=prod).

server:
  # nginx 뒤에 서므로 X-Forwarded-* 를 반영한다.
  # 이걸 켜지 않으면 감사 로그의 접속 IP 가 전부 nginx 컨테이너 주소로 남는다.
  #
  # 백엔드가 밖으로 열려 있으면 클라이언트가 이 헤더를 위조할 수 있다.
  # 배포 구성에서 backend 는 내부 네트워크에만 붙어 있어 nginx 를 거치지 않고는 닿지 않는다.
  # 로컬 개발(기본 프로파일)에서는 켜지 않는 이유도 그것이다.
  forward-headers-strategy: framework

logging:
  level:
    # 개발용 DEBUG 를 그대로 두면 환자 조회 쿼리까지 로그에 쌓인다
    com.nursecollab: INFO

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
