plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Spring Boot 3.3 이 물고 오는 Testcontainers 1.19.8 의 docker-java 는 Docker API 1.32 로 붙는다.
// Docker Engine 29 는 1.40 미만을 거부하므로(/info 가 400) 컨테이너를 아예 띄우지 못한다.
ext['testcontainers.version'] = '1.21.4'

group = 'com.nursecollab'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // @Audited 를 AOP 로 잡으려면 aspectjweaver 가 필요하다
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 컨테이너 기동 순서를 헬스체크로 잡으려면 /actuator/health 가 필요하다
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 부터 PostgreSQL 지원이 별도 모듈로 분리됐다. 없으면 기동 시 마이그레이션이 실패한다.
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// bootJar 옆에 -plain.jar 가 같이 나오면 도커에서 어느 것을 실행할지 헷갈린다.
// 실행 가능한 jar 하나만 만든다.
tasks.named('jar') {
    enabled = false
}

// Windows 기본 인코딩(MS949)으로 컴파일되면 한글 주석과 메시지가 깨진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'

}
