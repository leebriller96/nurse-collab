# 배포용. 로컬 개발은 docker-compose.yml(DB/Redis 만) 을 쓴다.
#
#   cp .env.example .env   # 값을 채운 뒤
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 밖으로 여는 포트는 웹 80 하나뿐이다. DB·Redis·백엔드는 내부 네트워크에만 붙는다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nursecollab
      POSTGRES_USER: nursecollab
      # 기본값을 두지 않는다. 비워 두면 기동이 실패해야 한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어야 한다}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursecollab -d nursecollab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    environment:
      # 한 대에 DB·Redis·웹이 같이 돈다. JVM 이 램을 많이 쥐면 서버가 통째로 죽는다.
      # 2GB 서버면 40, 4GB 면 50~60 이 무난하다.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=${JVM_HEAP_PERCENT:-50}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nursecollab
      SPRING_DATASOURCE_USERNAME: nursecollab
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      # 토큰 서명 키. 이 값이 바뀌면 발급된 토큰이 전부 무효가 된다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 넣어야 한다}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      # 도메인을 넣으면 Caddy 가 인증서를 받아 HTTPS 로 뜬다.
      # 비워 두면 :80 평문이다. 로컬에는 도메인이 없어 인증서를 받을 수 없다.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      TZ: Asia/Seoul
    ports:
      - "${WEB_PORT:-80}:80"
      # 인증서 발급(HTTP-01)은 80 으로 들어온다. 443 만 열면 발급이 안 된다.
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # 받아 둔 인증서를 여기 둔다. 이게 없으면 컨테이너를 새로 만들 때마다
      # 다시 발급받고, Let's Encrypt 발급 한도에 걸린다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 공개 데모용. 데모 계정 비밀번호가 공개돼 있어 누구나 데이터를 바꾼다.
  # 매일 새벽에 처음 상태로 되돌린다. 비공개로 쓸 거면 이 서비스를 지우면 된다.
  demo-reset:
    build:
      # 시드 SQL 을 이미지에 넣어야 해서 컨텍스트가 저장소 루트다
      context: .
      dockerfile: ops/demo-reset/Dockerfile
    environment:
      API_BASE: http://backend:8080
      PGHOST: postgres
      PGUSER: nursecollab
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: nursecollab
      RESET_AT: ${DEMO_RESET_AT:-04:00}
      TZ: Asia/Seoul
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
