# 배포용. 로컬 개발은 docker-compose.yml(DB/Redis 만) 을 쓴다.
#
#   cp .env.example .env   # 값을 채운 뒤
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 밖으로 여는 포트는 웹 80 하나뿐이다. DB·Redis·백엔드는 내부 네트워크에만 붙는다.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nursecollab
      POSTGRES_USER: nursecollab
      # 기본값을 두지 않는다. 비워 두면 기동이 실패해야 한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어야 한다}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursecollab -d nursecollab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nursecollab
      SPRING_DATASOURCE_USERNAME: nursecollab
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      # 토큰 서명 키. 이 값이 바뀌면 발급된 토큰이 전부 무효가 된다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 넣어야 한다}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      # nginx 는 기동할 때 proxy_pass 의 호스트명을 찾는다.
      # backend 가 없는 상태로 뜨면 "host not found in upstream" 으로 죽는다.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
