name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 같은 브랜치에 연달아 밀면 앞의 실행은 취소한다. 마지막 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers 가 진짜 PostgreSQL 을 띄운다. ubuntu 러너에는 도커가 이미 있다.
      - name: 빌드와 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때 어느 테스트가 깨졌는지 보려면 리포트가 있어야 한다
      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # tsc -b 가 포함돼 있어 타입 오류도 여기서 걸린다
      - run: npm run build

      # PWA 는 조용히 깨진다. 매니페스트 항목이 빠지거나 아이콘 경로가 틀려도
      # 화면은 멀쩡히 뜨고, 폰에서 "홈 화면에 추가" 가 안 나오고 나서야 알게 된다.
      # 백엔드 없이 도는 검사라 DB 를 띄우지 않는다.
      - name: 브라우저 준비
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: 설치 가능한 앱인지 확인
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          cd ../e2e && node check-pwa.mjs

  images:
    name: 배포 이미지 빌드
    runs-on: ubuntu-latest
    # 코드가 통과한 뒤에만 이미지를 만든다. 먼저 돌려 봐야 시간만 쓴다.
    needs: [backend, frontend]
    # compose 파일이 이 값들을 필수로 요구한다. build 단계도 파일을 읽으므로
    # 잡 전체에 걸어 둔다. 여기 값은 CI 안에서만 살고 밖으로 열리지 않는다.
    env:
      POSTGRES_PASSWORD: ci-only-password
      PHI_POSTGRES_PASSWORD: ci-only-phi-password
      JWT_KEYS_DIR: ./ci-keys
      WEB_PORT: '8081'
      WEB_TLS_PORT: '8443'
    steps:
      - uses: actions/checkout@v4

      # 저장소에 든 개발용 키로는 prod 프로파일이 뜨지 않는다(JwtKeyGuard).
      # 그 방어가 살아 있는지도 여기서 함께 확인되는 셈이다.
      - name: 서명 키쌍 만들기
        run: |
          mkdir -p ci-keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci-keys/jwt-private.pem
          openssl rsa -in ci-keys/jwt-private.pem -pubout -out ci-keys/jwt-public.pem
          chmod 600 ci-keys/jwt-private.pem
          # 바인드 마운트는 호스트의 소유자를 그대로 들고 간다.
          # 컨테이너는 uid 10001 로 돌므로 그 uid 가 읽을 수 있어야 한다.
          # 배포 문서가 안내하는 것과 같은 절차다. 여기서 같이 확인되는 셈이다.
          sudo chown -R 10001:10001 ci-keys

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 레지스트리에 올리지 않는다. 세 Dockerfile 이 아직 빌드되는지 확인하는 것이다.
      # compose 로 한 번에 굽는다. 따로 docker build 하면 같은 것을 두 번 굽게 된다.
      #
      # 스택은 원내 서버를 따로 띄우는 구성으로 올린다. 한 서버 구성과 이미지가 같고
      # 중계·망·DB 가 더 갈라져 있을 뿐이라, 이쪽에서 검사가 통과하면 더 많이 확인한 것이다.
      # 한 서버 구성은 compose 파일이 여전히 올바른지만 본다.
      - name: 이미지 빌드
        run: |
          docker compose -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.split.yml build

      # 스택을 실제로 올려 보안 헤더를 확인한다.
      # 깨지는 CSP 는 없느니만 못하다. 헤더만 넣고 끝내면 실시간 연결이나
      # 인라인 스타일 배치가 조용히 죽어도 화면은 그럴듯하게 보인다.
      - name: 스택 기동
        run: |
          docker compose -p ci -f docker-compose.split.yml up -d
          # 일정 보드 검사에 시연 데이터가 필요하다. 초기화 컨테이너가 끝나야 한다.
          for i in $(seq 1 120); do
            docker compose -p ci -f docker-compose.split.yml logs demo-reset 2>/dev/null \
              | grep -q "다음 초기화까지" && break
            sleep 2
          done

      # 갈라 놓았다고 적어 두는 것과 실제로 닿지 않는 것은 다르다.
      # compose 에 망 하나를 잘못 붙이면 모든 화면이 멀쩡히 돌면서 격리만 사라진다.
      - name: 원내 격리 확인
        run: |
          stack="docker compose -p ci -f docker-compose.split.yml"
          if $stack exec -T backend getent hosts phi-postgres; then
            echo "업무 서버에서 원내 DB 이름이 풀린다. 원내 망에 붙어 있다"; exit 1
          fi
          if $stack exec -T onprem test -e /run/keys/jwt-private.pem; then
            echo "원내 서버에 서명용 개인키 파일이 있다"; exit 1
          fi
          echo "업무 서버는 원내 DB 에 닿지 않고, 원내 서버에는 개인키가 없다"

      - name: 보안 헤더 확인
        working-directory: e2e
        run: |
          npm ci && npx playwright install --with-deps chromium
          APP=http://localhost:8081 node check-csp.mjs

      # 막히는 자리가 없는지. 조회가 실패했을 때 빠져나올 수 있는지와
      # 되돌릴 수 없는 동작에 한 번 더 묻는지는 화면만 봐서는 알 수 없다.
      - name: 사용 흐름 확인
        working-directory: e2e
        run: APP=http://localhost:8081 node check-ux.mjs

      # 스켈레톤은 자리를 잡아 두는 것이 목적이다. 모양이 어긋나면 값이 들어올 때
      # 화면이 밀려서, 글자 한 줄보다 나을 것이 없어진다. 눈이 아니라 좌표로 잰다.
      - name: 로딩 자리 확인
        working-directory: e2e
        run: APP=http://localhost:8081 node check-skeleton.mjs

      # 내 동작 확인과 실시간 알림이 같은 자리에 뜬다. 한쪽만 보면
      # 다른 쪽이 죽었거나 둘이 겹치는 것을 모른다.
      - name: 동작 확인 표시
        working-directory: e2e
        run: APP=http://localhost:8081 node check-feedback.mjs

      # 조회 조건이 살아남는지, 당겨서 새로고침이 손가락으로 되는지.
      # 둘 다 개발 중에는 그렇게 쓸 일이 없어서 깨져도 모르고 지나간다.
      - name: 조회 조건 유지
        working-directory: e2e
        run: APP=http://localhost:8081 node check-filters.mjs

      - name: 당겨서 새로고침
        working-directory: e2e
        run: APP=http://localhost:8081 node check-pull-refresh.mjs

      # 병동이 남긴 주의사항이 검사실 화면의 경고까지 이어지는지.
      # 이 연결이 이 프로젝트에서 제일 특징적인 부분이라 끊기면 안 된다.
      - name: 주의사항이 경고로 이어지는지
        working-directory: e2e
        run: APP=http://localhost:8081 node check-alerts.mjs

      # 이송 말고 다른 종류의 업무가 실제로 도는지.
      # 특히 환자가 없는 업무(장비 수리)가 중요하다. 이송만 있을 때는 모든 목록이
      # 환자 이름을 그냥 꺼내 썼고, 한 군데라도 빠뜨리면 그 화면만 백지가 된다.
      # 초기화가 심는 시드가 스키마와 어긋나도 여기서 먼저 깨진다.
      - name: 다른 종류의 업무
        working-directory: e2e
        run: APP=http://localhost:8081 node check-order-types.mjs

      # 환자 정보가 업무 흐름과 실제로 갈려 있는지.
      # 원내가 살아 있으면 화면은 늘 멀쩡해 보인다. 끊어 봐야 무엇이 어디서 오는지 드러난다.
      # 업무 응답 본문을 직접 뒤져 이름과 진단명이 섞여 있지 않은지도 함께 본다.
      - name: 환자 정보 분리
        working-directory: e2e
        run: APP=http://localhost:8081 node check-phi-split.mjs

      - name: 실패하면 스택 로그를 남긴다
        if: failure()
        run: docker compose -p ci -f docker-compose.split.yml logs --tail 80

      - name: 스택 정리
        if: always()
        run: docker compose -p ci -f docker-compose.split.yml down -v
