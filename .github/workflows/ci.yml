name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 같은 브랜치에 연달아 밀면 앞의 실행은 취소한다. 마지막 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 빌드 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers 가 진짜 PostgreSQL 을 띄운다. ubuntu 러너에는 도커가 이미 있다.
      - name: 빌드와 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때 어느 테스트가 깨졌는지 보려면 리포트가 있어야 한다
      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # tsc -b 가 포함돼 있어 타입 오류도 여기서 걸린다
      - run: npm run build

      # PWA 는 조용히 깨진다. 매니페스트 항목이 빠지거나 아이콘 경로가 틀려도
      # 화면은 멀쩡히 뜨고, 폰에서 "홈 화면에 추가" 가 안 나오고 나서야 알게 된다.
      # 백엔드 없이 도는 검사라 DB 를 띄우지 않는다.
      - name: 브라우저 준비
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: 설치 가능한 앱인지 확인
        run: |
          npm run preview &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          cd ../e2e && node check-pwa.mjs

  images:
    name: 배포 이미지 빌드
    runs-on: ubuntu-latest
    # 코드가 통과한 뒤에만 이미지를 만든다. 먼저 돌려 봐야 시간만 쓴다.
    needs: [backend, frontend]
    # compose 파일이 이 값들을 필수로 요구한다. build 단계도 파일을 읽으므로
    # 잡 전체에 걸어 둔다. 여기 값은 CI 안에서만 살고 밖으로 열리지 않는다.
    env:
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0123456789abcdef
      WEB_PORT: '8081'
      WEB_TLS_PORT: '8443'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 레지스트리에 올리지 않는다. 세 Dockerfile 이 아직 빌드되는지 확인하는 것이다.
      # compose 로 한 번에 굽는다. 따로 docker build 하면 같은 것을 두 번 굽게 된다.
      - name: 이미지 빌드
        run: docker compose -f docker-compose.prod.yml build

      # 스택을 실제로 올려 보안 헤더를 확인한다.
      # 깨지는 CSP 는 없느니만 못하다. 헤더만 넣고 끝내면 실시간 연결이나
      # 인라인 스타일 배치가 조용히 죽어도 화면은 그럴듯하게 보인다.
      - name: 스택 기동
        run: |
          docker compose -p ci -f docker-compose.prod.yml up -d
          # 일정 보드 검사에 시연 데이터가 필요하다. 초기화 컨테이너가 끝나야 한다.
          for i in $(seq 1 90); do
            docker compose -p ci -f docker-compose.prod.yml logs demo-reset 2>/dev/null \
              | grep -q "다음 초기화까지" && break
            sleep 2
          done

      - name: 보안 헤더 확인
        working-directory: e2e
        run: |
          npm ci && npx playwright install --with-deps chromium
          APP=http://localhost:8081 node check-csp.mjs

      # 막히는 자리가 없는지. 조회가 실패했을 때 빠져나올 수 있는지와
      # 되돌릴 수 없는 동작에 한 번 더 묻는지는 화면만 봐서는 알 수 없다.
      - name: 사용 흐름 확인
        working-directory: e2e
        run: APP=http://localhost:8081 node check-ux.mjs

      # 스켈레톤은 자리를 잡아 두는 것이 목적이다. 모양이 어긋나면 값이 들어올 때
      # 화면이 밀려서, 글자 한 줄보다 나을 것이 없어진다. 눈이 아니라 좌표로 잰다.
      - name: 로딩 자리 확인
        working-directory: e2e
        run: APP=http://localhost:8081 node check-skeleton.mjs

      # 내 동작 확인과 실시간 알림이 같은 자리에 뜬다. 한쪽만 보면
      # 다른 쪽이 죽었거나 둘이 겹치는 것을 모른다.
      - name: 동작 확인 표시
        working-directory: e2e
        run: APP=http://localhost:8081 node check-feedback.mjs

      # 조회 조건이 살아남는지, 당겨서 새로고침이 손가락으로 되는지.
      # 둘 다 개발 중에는 그렇게 쓸 일이 없어서 깨져도 모르고 지나간다.
      - name: 조회 조건 유지
        working-directory: e2e
        run: APP=http://localhost:8081 node check-filters.mjs

      - name: 당겨서 새로고침
        working-directory: e2e
        run: APP=http://localhost:8081 node check-pull-refresh.mjs

      - name: 실패하면 스택 로그를 남긴다
        if: failure()
        run: docker compose -p ci -f docker-compose.prod.yml logs --tail 80

      - name: 스택 정리
        if: always()
        run: docker compose -p ci -f docker-compose.prod.yml down -v
